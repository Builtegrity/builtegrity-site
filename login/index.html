<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Builtegrity Sign In</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell" style="max-width:560px;padding-top:12vh">
    <section class="panel">
      <p class="eyebrow">Builtegrity · Secure access</p>
      <h1>Sign in</h1>
      <p class="muted">Builtegrity uses Clerk for application identity. Builtegrity does not store your login password.</p>
      <div class="actions">
        <button id="loginButton" type="button">Continue to secure sign in</button>
      </div>
      <p id="loginStatus" class="muted"></p>
    </section>
  </main>
  <script type="module" src="/login/app.js"></script>
</body>
</html>
