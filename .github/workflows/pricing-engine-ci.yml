name: Pricing Engine CI

on:
  pull_request:
  push:
    branches: [main, system-coherence-hardening-v2]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check critical JavaScript syntax
        run: |
          node --check worker/src/pricing.js
          node --check worker/src/stripe.js
          node --check worker/src/webhooks.js
          node --check worker/src/index.js
          node --check worker/src/autopilot.js
          node --check worker/src/case-router.js

      - name: Build entire D1 schema from zero
        run: |
          rm -f /tmp/builtegrity-pricing.db
          for file in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            sqlite3 /tmp/builtegrity-pricing.db < "$file"
          done
          sqlite3 /tmp/builtegrity-pricing.db "PRAGMA foreign_key_check;" > /tmp/fk.txt
          test ! -s /tmp/fk.txt

      - name: Verify canonical BG_STANDARD_V1
        run: |
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM pricing_versions WHERE id='BG_STANDARD_V1' AND status='ACTIVE' AND currency='USD' AND percentage_bps=10 AND pricing_model='AMOUNT_BANDS' AND uncapped=1;")" = "1"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM pricing_versions WHERE status='ACTIVE' AND currency='USD';")" = "1"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT group_concat(min_amount_cents||':'||COALESCE(max_amount_cents,'OPEN')||':'||base_fee_cents,'|') FROM pricing_amount_bands WHERE pricing_version_id='BG_STANDARD_V1' ORDER BY min_amount_cents;")" = "1:100:1|101:500:2|501:1000:3|1001:OPEN:5"

      - name: Verify exact fee arithmetic and uncapped upside
        run: |
          node --input-type=module <<'NODE'
          import { calculateAmountBandFee } from './worker/src/pricing.js';
          const rule={percentage_bps:10,maximum_cents:Number.MAX_SAFE_INTEGER,uncapped:1};
          const cases=[
            [1,1,10010,1,10],[99,1,10990,1,990],[100,1,11000,1,1000],
            [101,2,21010,2,1010],[500,2,25000,2,5000],[501,3,35010,3,5010],
            [1000,3,40000,4,0],[1001,5,60010,6,10],[2000,5,70000,7,0],
            [100000,5,1050000,105,0],[100000000000,5,1000000050000,100000005,0]
          ];
          for(const [amount,base,exact,whole,residual] of cases){
            const q=calculateAmountBandFee(amount,rule,{base_fee_cents:base});
            if(q.fee_micros!==exact||q.processor_fee_cents!==whole||q.residual_micros!==residual){
              throw new Error(`${amount}: ${JSON.stringify(q)}`);
            }
          }
          const q99=calculateAmountBandFee(99,rule,{base_fee_cents:1});
          if(Number(BigInt(q99.fee_micros)*10_000_000n)/1_000_000!==109900) throw new Error('10M x 99c economics drifted');
          if(Number(BigInt(q99.fee_micros)*1000n)/1_000_000!==10.99) throw new Error('merchant 1000 x 99c economics drifted');
          NODE

      - name: Seed test hierarchy
        run: sqlite3 /tmp/builtegrity-pricing.db < transaction-engine/seed-tx-0001.sql

      - name: Verify pricing snapshot is server/DB validated
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at
            ) VALUES (
              'TX-NO-GATE','PUR-0001','MER-0001','CUST-0001','PAYMENT','missing legal gate test',99,'USD',
              'TERMS-001','test terms',1,'STRIPE_APPLICATION_FEE','tx-no-gate-token',
              'BG_STANDARD_V1',10,0,9007199254740991,1,CURRENT_TIMESTAMP
            );"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT pricing_amount_band_id||':'||pricing_base_cents||':'||pricing_fee_micros||':'||pricing_fee_residual_micros FROM transactions WHERE id='TX-NO-GATE';")" = "BGV1-BAND-001:1:10990:990"
          if sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at
            ) VALUES (
              'TX-BAD-PRICE','PUR-0001','MER-0001','CUST-0001','PAYMENT','bad price',99,'USD',
              'TERMS-001','test terms',2,'STRIPE_APPLICATION_FEE','tx-bad-price-token',
              'BG_STANDARD_V1',10,0,9007199254740991,2,CURRENT_TIMESTAMP
            );" 2>/tmp/bad-price.txt; then
            echo 'Expected invalid pricing rejection'; exit 1
          fi
          grep -q 'BG_STANDARD_V1' /tmp/bad-price.txt

      - name: Verify processor truth cannot bypass missing legal gate in either event order
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            UPDATE transactions
               SET payment_status='succeeded',payment_at='2026-10-14T00:00:00Z',customer_paid_cents=99
             WHERE id='TX-NO-GATE';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification FROM transactions WHERE id='TX-NO-GATE';")" = "FEE_EXCEPTION"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COALESCE((SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD'),0);")" = "0"
          sqlite3 /tmp/builtegrity-pricing.db "
            UPDATE transactions
               SET stripe_application_fee_id='fee_no_gate',application_fee_gross_confirmed_cents=1,integrity_fee_collected_cents=1
             WHERE id='TX-NO-GATE';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||legal_compliance_state||':'||bg_fee_earned_cents FROM transactions WHERE id='TX-NO-GATE';")" = "FEE_EXCEPTION:REVIEW_REQUIRED:0"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM transaction_fee_entitlements WHERE transaction_id='TX-NO-GATE';")" = "0"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM merchant_fee_carry_events WHERE transaction_id='TX-NO-GATE' AND event_type='ACCRUED';")" = "0"

          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at
            ) VALUES (
              'TX-NO-GATE-SAME','PUR-0001','MER-0001','CUST-0001','PAYMENT','same-event missing gate test',99,'USD',
              'TERMS-001','test terms',1,'STRIPE_APPLICATION_FEE','tx-no-gate-same-token',
              'BG_STANDARD_V1',10,0,9007199254740991,1,CURRENT_TIMESTAMP
            );
            UPDATE transactions
               SET payment_status='succeeded',payment_at='2026-10-14T00:00:30Z',customer_paid_cents=99,
                   stripe_application_fee_id='fee_no_gate_same',application_fee_gross_confirmed_cents=1,integrity_fee_collected_cents=1
             WHERE id='TX-NO-GATE-SAME';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||legal_compliance_state||':'||bg_fee_earned_cents FROM transactions WHERE id='TX-NO-GATE-SAME';")" = "PENDING_PROTECTED:REVIEW_REQUIRED:0"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM transaction_fee_entitlements WHERE transaction_id='TX-NO-GATE-SAME';")" = "0"

      - name: Prepare cleared RI customer-transaction test lane
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            UPDATE state_jurisdiction_support
               SET customer_transaction_status='READY',
                   privacy_review_status='CLEARED',
                   breach_review_status='CLEARED',
                   electronic_transactions_review_status='CLEARED',
                   consumer_protection_review_status='CLEARED',
                   counsel_reference='TEST-COUNSEL-RI',
                   reviewed_at='2026-10-14T00:00:00Z',
                   next_review_due_at='2027-10-14T00:00:00Z',
                   updated_at=CURRENT_TIMESTAMP
             WHERE state_code='RI';
            UPDATE customers
               SET country_code='US',state_code='RI',jurisdiction_source='CUSTOMER_ATTESTATION',
                   jurisdiction_verified_at='2026-10-14T00:00:00Z',jurisdiction_match_status='UNVERIFIED'
             WHERE id='CUST-0001';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT customer_transaction_status||':'||consumer_protection_review_status FROM state_jurisdiction_support WHERE state_code='RI';")" = "READY:CLEARED"

      - name: Verify valid PROTECTED transaction accrues residual exactly once
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at,customer_attested_country_code,customer_attested_state_code,customer_attested_at
            ) VALUES (
              'TX-CARRY-99','PUR-0001','MER-0001','CUST-0001','PAYMENT','valid 99 cent protected test',99,'USD',
              'TERMS-001','test terms',1,'STRIPE_APPLICATION_FEE','tx-carry-99-token',
              'BG_STANDARD_V1',10,0,9007199254740991,1,CURRENT_TIMESTAMP,'US','RI','2026-10-14T00:01:00Z'
            );
            UPDATE transactions SET checkout_legal_gate_at='2026-10-14T00:01:01Z' WHERE id='TX-CARRY-99';
            UPDATE transactions
               SET payment_status='succeeded',payment_at='2026-10-14T00:01:30Z',customer_paid_cents=99,
                   stripe_application_fee_id='fee_carry_99',application_fee_gross_confirmed_cents=1,integrity_fee_collected_cents=1
             WHERE id='TX-CARRY-99';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||legal_compliance_state FROM transactions WHERE id='TX-CARRY-99';")" = "PROTECTED:PENDING"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD';")" = "990"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT entitlement_micros||':'||residual_micros||':'||carry_collected_cents FROM transaction_fee_entitlements WHERE transaction_id='TX-CARRY-99';")" = "10990:990:0"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM transaction_carry_finalization_requests WHERE transaction_id='TX-CARRY-99';")" = "1"
          sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET application_fee_gross_confirmed_cents=1 WHERE id='TX-CARRY-99';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD';")" = "990"

      - name: Build exactly one cent of valid residual carry
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at,customer_attested_country_code,customer_attested_state_code,customer_attested_at
            ) VALUES (
              'TX-CARRY-901','PUR-0001','MER-0001','CUST-0001','PAYMENT','carry builder',901,'USD',
              'TERMS-001','test terms',3,'STRIPE_APPLICATION_FEE','tx-carry-901-token',
              'BG_STANDARD_V1',10,0,9007199254740991,3,CURRENT_TIMESTAMP,'US','RI','2026-10-14T00:02:00Z'
            );
            UPDATE transactions SET checkout_legal_gate_at='2026-10-14T00:02:01Z' WHERE id='TX-CARRY-901';
            UPDATE transactions
               SET payment_status='succeeded',payment_at='2026-10-14T00:02:30Z',customer_paid_cents=901,
                   stripe_application_fee_id='fee_carry_901',application_fee_gross_confirmed_cents=3,integrity_fee_collected_cents=3
             WHERE id='TX-CARRY-901';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||pricing_fee_residual_micros FROM transactions WHERE id='TX-CARRY-901';")" = "PROTECTED:9010"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD';")" = "10000"

      - name: Verify failed fee confirmation leaves reserved carry releasable
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at,customer_attested_country_code,customer_attested_state_code,customer_attested_at
            ) VALUES (
              'TX-CARRY-FAIL','PUR-0001','MER-0001','CUST-0001','PAYMENT','reserved carry fee exception',2000,'USD',
              'TERMS-001','test terms',7,'STRIPE_APPLICATION_FEE','tx-carry-fail-token',
              'BG_STANDARD_V1',10,0,9007199254740991,7,CURRENT_TIMESTAMP,'US','RI','2026-10-14T00:03:00Z'
            );
            UPDATE transactions SET checkout_legal_gate_at='2026-10-14T00:03:01Z' WHERE id='TX-CARRY-FAIL';
            UPDATE transactions SET pricing_carry_reserved_cents=1 WHERE id='TX-CARRY-FAIL';
            UPDATE transactions SET payment_status='succeeded',payment_at='2026-10-14T00:03:30Z',customer_paid_cents=2000 WHERE id='TX-CARRY-FAIL';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||pricing_carry_reserved_cents||':'||pricing_carry_settled_cents FROM transactions WHERE id='TX-CARRY-FAIL';")" = "FEE_EXCEPTION:1:0"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD';")" = "0"
          sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET pricing_carry_reserved_cents=0,pricing_carry_released_at=CURRENT_TIMESTAMP WHERE id='TX-CARRY-FAIL';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD';")" = "10000"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM merchant_fee_carry_events WHERE transaction_id='TX-CARRY-FAIL' AND event_type='RELEASED';")" = "1"

      - name: Verify prior carry settles only after later payment becomes PROTECTED
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_calculated_cents,pricing_locked_at,customer_attested_country_code,customer_attested_state_code,customer_attested_at
            ) VALUES (
              'TX-CARRY-OK','PUR-0001','MER-0001','CUST-0001','PAYMENT','reserved carry success',2000,'USD',
              'TERMS-001','test terms',7,'STRIPE_APPLICATION_FEE','tx-carry-ok-token',
              'BG_STANDARD_V1',10,0,9007199254740991,7,CURRENT_TIMESTAMP,'US','RI','2026-10-14T00:04:00Z'
            );
            UPDATE transactions SET checkout_legal_gate_at='2026-10-14T00:04:01Z' WHERE id='TX-CARRY-OK';
            UPDATE transactions SET pricing_carry_reserved_cents=1 WHERE id='TX-CARRY-OK';
            UPDATE transactions SET payment_status='succeeded',payment_at='2026-10-14T00:04:30Z',customer_paid_cents=2000 WHERE id='TX-CARRY-OK';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||pricing_carry_settled_cents FROM transactions WHERE id='TX-CARRY-OK';")" = "FEE_EXCEPTION:0"
          sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET stripe_application_fee_id='fee_carry_ok',application_fee_gross_confirmed_cents=8,integrity_fee_collected_cents=8 WHERE id='TX-CARRY-OK';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT record_classification||':'||pricing_carry_settled_cents FROM transactions WHERE id='TX-CARRY-OK';")" = "PROTECTED:1"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT entitlement_micros||':'||carry_collected_cents FROM transaction_fee_entitlements WHERE transaction_id='TX-CARRY-OK';")" = "70000:1"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT amount_micros FROM transaction_economics_ledger WHERE transaction_id='TX-CARRY-OK' AND basis='ACTUAL' AND entry_kind='REVENUE' AND category='INTEGRITY_FEE' ORDER BY created_at DESC LIMIT 1;")" = "80000"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT available_micros FROM merchant_fee_carry WHERE merchant_id='MER-0001' AND currency='USD';")" = "0"

      - name: Verify protected pricing aggregate uses classification not payment success
        run: |
          summary="$(sqlite3 /tmp/builtegrity-pricing.db "SELECT successful_protected_transactions||':'||earned_fee_micros||':'||application_fee_cash_cents||':'||carry_settled_cents FROM merchant_pricing_monthly_summary WHERE merchant_id='MER-0001' AND month='2026-10';")"
          test "$summary" = "3:120000:12:1"

      - name: Verify refund does not erase earned entitlement
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET payment_status='refunded',refunded_cents=99 WHERE id='TX-CARRY-99';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT entitlement_micros FROM transaction_fee_entitlements WHERE transaction_id='TX-CARRY-99';")" = "10990"

      - name: Verify economic and safety guardrails remain encoded
        run: |
          margin="$(sqlite3 /tmp/builtegrity-pricing.db "SELECT floor_planning_margin_ppm FROM pricing_floor_health WHERE pricing_version_id='BG_STANDARD_V1';")"
          test "$margin" -ge 800000
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT minimum_floor_margin_ppm||':'||human_touch_orange_ppm||':'||human_touch_red_ppm FROM financial_safety_policy WHERE id='GLOBAL';")" = "800000:200:500"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM optional_service_controls WHERE service_code IN ('AI_ASSIST','ENRICHMENT') AND enabled=0;")" = "2"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM workforce_vendors WHERE status='APPROVED' AND auto_dispatch_enabled=1;")" = "0"

      - name: Verify refund and caller-authority boundaries remain wired
        run: |
          if grep -R --exclude='*.yml' --exclude='*.md' -nE 'refund_application_fee|refundApplicationFee' worker transaction-engine; then
            echo 'Application-fee refund coupling is prohibited outside explicit credit path'; exit 1
          fi
          grep -q "case 'application_fee.refunded'" worker/src/webhooks.js
          grep -q "adjustmentType: 'APPLICATION_FEE_REFUND'" worker/src/webhooks.js
          grep -q 'FORBIDDEN_TRANSACTION_PRICING_INPUTS' worker/src/index.js
          grep -q 'Builtegrity pricing is server-owned' worker/src/index.js
          grep -q "payment_intent_data\[application_fee_amount\]" worker/src/stripe.js

      - name: Verify resolution/workforce autopilot remains wired
        run: |
          grep -q 'runResolutionAutopilot' worker/src/case-router.js
          grep -q 'runResolutionAutopilot' worker/src/autopilot.js
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM resolution_playbooks WHERE active=1;")" -ge "15"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM resolution_steps;")" -ge "30"
