name: Pricing Engine CI

on:
  pull_request:
  push:
    branches:
      - atlas/pricing-v1
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pricing JavaScript syntax
        run: |
          node --check worker/src/pricing.js
          node --check worker/src/index.js
          node --check worker/src/stripe.js

      - name: Build full D1 schema and seed legacy TX-0001
        run: |
          rm -f /tmp/builtegrity-pricing.db
          for file in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            sqlite3 /tmp/builtegrity-pricing.db < "$file"
          done
          sqlite3 /tmp/builtegrity-pricing.db < transaction-engine/seed-tx-0001.sql

      - name: Verify PRICE-V1 is universal and flat
        run: |
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM pricing_versions WHERE id='PRICE-2026-10-V1' AND status='ACTIVE' AND currency='USD' AND percentage_bps=15 AND minimum_cents=5 AND maximum_cents=1000 AND density_mode='FLAT';")" = "1"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT COUNT(*) FROM pricing_density_bands WHERE pricing_version_id='PRICE-2026-10-V1';")" = "0"
          if sqlite3 /tmp/builtegrity-pricing.db "INSERT INTO pricing_versions (id,status,currency,percentage_bps,minimum_cents,maximum_cents,density_mode) VALUES ('PRICE-BAD-SECOND','ACTIVE','USD',15,5,1000,'FLAT');" 2>/tmp/second-price-error.txt; then
            echo "Expected database to reject a second active USD pricing version"
            exit 1
          fi

      - name: Verify PRICE-V1 arithmetic
        run: |
          node --input-type=module <<'NODE'
          import { calculateFeeCents } from './worker/src/pricing.js';
          const rule = { percentage_bps: 15, minimum_cents: 5, maximum_cents: 1000 };
          const cases = [
            [300, 5],
            [500, 5],
            [1100, 5],
            [2000, 5],
            [3333, 5],
            [4000, 6],
            [5000, 8],
            [10000, 15],
            [50000, 75],
            [100000, 150],
            [500000, 750],
            [1000000, 1000],
            [2500000, 1000],
          ];
          for (const [amount, expected] of cases) {
            const actual = calculateFeeCents(amount, rule);
            if (actual !== expected) throw new Error(`${amount} cents expected ${expected}, got ${actual}`);
          }
          NODE

      - name: Verify five-cent longevity guardrail
        run: |
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT floor_revenue_micros FROM pricing_floor_health;")" = "50000"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT target_human_reserve_micros FROM pricing_floor_health;")" = "7500"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT floor_reversal_reserve_micros FROM pricing_floor_health;")" = "1000"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT floor_planning_contribution_micros FROM pricing_floor_health;")" = "35330"
          margin="$(sqlite3 /tmp/builtegrity-pricing.db "SELECT floor_planning_margin_ppm FROM pricing_floor_health;")"
          test "$margin" -ge 700000
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT human_touch_target_ppm FROM pricing_economic_guardrails WHERE id='GUARD-PRICE-V1';")" = "500"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT human_touch_mature_ppm FROM pricing_economic_guardrails WHERE id='GUARD-PRICE-V1';")" = "100"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT human_touch_warn_ppm FROM pricing_economic_guardrails WHERE id='GUARD-PRICE-V1';")" = "1000"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT human_touch_critical_ppm FROM pricing_economic_guardrails WHERE id='GUARD-PRICE-V1';")" = "1500"

      - name: Verify versioned transaction price locks before economics initialize
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "
            INSERT INTO transactions (
              id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,
              terms_version,terms_snapshot,refund_policy_snapshot,cancellation_policy_snapshot,
              integrity_fee_earned_cents,fee_collection_method,payment_access_token,
              pricing_version_id,pricing_percentage_bps,pricing_minimum_cents,pricing_maximum_cents,
              pricing_density_band_id,pricing_calculated_cents,pricing_locked_at
            ) VALUES (
              'TX-PRICE-TEST','PUR-0001','MER-0001','CUST-0001','PAYMENT','Eleven dollar pricing test',1100,'USD',
              'TERMS-001','Pricing test terms',NULL,NULL,
              5,'STRIPE_APPLICATION_FEE','pricing-test-token',
              'PRICE-2026-10-V1',15,5,1000,NULL,5,CURRENT_TIMESTAMP
            );"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT integrity_fee_earned_cents FROM transactions WHERE id='TX-PRICE-TEST';")" = "5"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT estimated_revenue_micros FROM transaction_economics_summary WHERE transaction_id='TX-PRICE-TEST';")" = "50000"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT amount_cents FROM transaction_components WHERE transaction_id='TX-PRICE-TEST' AND component_type_code='INTEGRITY_FEE' AND basis='EXPECTED' LIMIT 1;")" = "5"

      - name: Verify locked pricing cannot be rewritten
        run: |
          if sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET integrity_fee_earned_cents=6 WHERE id='TX-PRICE-TEST';" 2>/tmp/immutable-price-error.txt; then
            echo "Expected locked fee mutation to fail"
            exit 1
          fi
          grep -q 'transaction pricing is immutable once locked' /tmp/immutable-price-error.txt
          if sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET pricing_minimum_cents=6 WHERE id='TX-PRICE-TEST';" 2>/tmp/immutable-min-error.txt; then
            echo "Expected locked pricing snapshot mutation to fail"
            exit 1
          fi

      - name: Verify caller cannot author Builtegrity pricing
        run: |
          grep -q 'FORBIDDEN_TRANSACTION_PRICING_INPUTS' worker/src/index.js
          grep -q 'Builtegrity pricing is server-owned' worker/src/index.js
          grep -q 'priceTransaction(env, txInput.amount_cents' worker/src/index.js
          grep -q 'pricing.integrity_fee_earned_cents' worker/src/index.js
          grep -q "form\['payment_intent_data\[application_fee_amount\]'\]" worker/src/stripe.js

      - name: Verify monthly effective-rate measurement survives refunds
        run: |
          sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET payment_status='succeeded',payment_at='2026-10-12T12:00:00Z',customer_paid_cents=1100,integrity_fee_collected_cents=5 WHERE id='TX-PRICE-TEST';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT successful_protected_transactions FROM merchant_pricing_monthly_summary WHERE merchant_id='MER-0001' AND month='2026-10';")" = "1"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT effective_fee_bps FROM merchant_pricing_monthly_summary WHERE merchant_id='MER-0001' AND month='2026-10';")" = "45.45"
          sqlite3 /tmp/builtegrity-pricing.db "UPDATE transactions SET payment_status='refunded' WHERE id='TX-PRICE-TEST';"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT successful_protected_transactions FROM merchant_pricing_monthly_summary WHERE merchant_id='MER-0001' AND month='2026-10';")" = "1"

      - name: Verify density escalation is shadow-only in V1
        run: |
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT density_mode FROM pricing_versions WHERE id='PRICE-2026-10-V1';")" = "FLAT"
          test "$(sqlite3 /tmp/builtegrity-pricing.db "SELECT shadow_minimum_cents FROM pricing_density_shadow_transactions WHERE transaction_id='TX-PRICE-TEST';")" = "5"
          grep -q 'refuses `BANDS` pricing unless it is given an explicit deterministic monthly ordinal' docs/pricing-engine.md
          grep -q 'increasing the unit floor as a merchant becomes larger creates the wrong infrastructure incentive' docs/pricing-engine.md
