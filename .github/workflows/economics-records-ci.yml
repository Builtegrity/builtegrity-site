name: Economics and Records CI

on:
  pull_request:
  push:
    branches:
      - atlas/unit-economics-pdf-tenancy
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check new JavaScript syntax
        run: |
          node --check worker/src/db.js
          node --check worker/src/pdf.js
          node --check worker/src/records.js
          node --check worker/src/runtime.js
          node --check public/pay/success/app.js

      - name: Build full D1 schema and seed TX-0001
        run: |
          rm -f /tmp/builtegrity-economics.db
          for file in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            sqlite3 /tmp/builtegrity-economics.db < "$file"
          done
          sqlite3 /tmp/builtegrity-economics.db < transaction-engine/seed-tx-0001.sql
          sqlite3 /tmp/builtegrity-economics.db < transaction-engine/ci-transaction-jurisdiction.sql

      - name: Verify identity and tenancy boundaries
        run: |
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='merchant_access';")" = "1"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='partner_access';")" = "1"
          grep -q 'Clerk answers: \*\*Who is this user?\*\*' docs/clerk-setup.md
          grep -q "Do not use Clerk Organizations" docs/clerk-setup.md
          grep -q 'D1 merchant_access / partner_access own tenancy' wrangler.toml.example

      - name: Verify merchant-paid fee invariant
        run: |
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT fee_payer FROM transactions WHERE id='TX-0001';")" = "MERCHANT"
          if sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET fee_payer='CUSTOMER' WHERE id='TX-0001';" 2>/tmp/fee-payer-error.txt; then
            echo "Expected D1 to reject a consumer-paid Builtegrity fee"
            exit 1
          fi

      - name: Verify automatic record token and hidden unit economics
        run: |
          test -n "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_access_token FROM transactions WHERE id='TX-0001';")"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_classification FROM transactions WHERE id='TX-0001';")" = "PENDING_PROTECTED"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-0001';")" = "0"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT estimated_revenue_micros FROM transaction_economics_summary WHERE transaction_id='TX-0001';")" = "250000"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT estimated_cost_micros FROM transaction_economics_summary WHERE transaction_id='TX-0001';")" = "2594"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT estimated_contribution_micros FROM transaction_economics_summary WHERE transaction_id='TX-0001';")" = "247406"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT COUNT(*) FROM transaction_economics_ledger WHERE transaction_id='TX-0001' AND basis='ESTIMATED';")" = "4"

      - name: Verify fee cash alone cannot create Builtegrity revenue
        run: |
          sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET integrity_fee_collected_cents=25 WHERE id='TX-0001';"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_classification FROM transactions WHERE id='TX-0001';")" = "PENDING_PROTECTED"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-0001';")" = "0"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT actual_revenue_micros FROM transaction_economics_summary WHERE transaction_id='TX-0001';")" = "0"
          sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET integrity_fee_collected_cents=0 WHERE id='TX-0001';"

      - name: Verify successful exact fee promotes transaction to PROTECTED and recognizes revenue
        run: |
          sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET payment_status='succeeded', payment_at='2026-10-13T00:00:00.000Z', stripe_application_fee_id='fee_test_0001', application_fee_gross_confirmed_cents=25, integrity_fee_collected_cents=25 WHERE id='TX-0001';"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_classification FROM transactions WHERE id='TX-0001';")" = "PROTECTED"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-0001';")" = "25"
          test -n "$(sqlite3 /tmp/builtegrity-economics.db "SELECT protection_confirmed_at FROM transactions WHERE id='TX-0001';")"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT actual_revenue_micros FROM transaction_economics_summary WHERE transaction_id='TX-0001';")" = "250000"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT COUNT(*) FROM transaction_economics_ledger WHERE transaction_id='TX-0001' AND basis='ACTUAL' AND entry_kind='REVENUE' AND category='INTEGRITY_FEE';")" = "1"

      - name: Verify missing or mismatched fee cannot be PROTECTED
        run: |
          sqlite3 /tmp/builtegrity-economics.db "INSERT INTO transactions (id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,integrity_fee_earned_cents,fee_collection_method,payment_status) VALUES ('TX-FEE-EXC','PUR-0001','MER-0001','CUST-0001','PAYMENT','Fee exception test',50000,'USD',25,'STRIPE_APPLICATION_FEE','succeeded');"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_classification FROM transactions WHERE id='TX-FEE-EXC';")" = "PENDING_PROTECTED"
          sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET payment_at='2026-10-13T00:01:00.000Z' WHERE id='TX-FEE-EXC';"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_classification FROM transactions WHERE id='TX-FEE-EXC';")" = "FEE_EXCEPTION"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-FEE-EXC';")" = "0"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT actual_revenue_micros FROM transaction_economics_summary WHERE transaction_id='TX-FEE-EXC';")" = "0"
          sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET stripe_application_fee_id='fee_bad', application_fee_gross_confirmed_cents=20, integrity_fee_collected_cents=20 WHERE id='TX-FEE-EXC';"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT record_classification FROM transactions WHERE id='TX-FEE-EXC';")" = "FEE_EXCEPTION"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-FEE-EXC';")" = "0"

      - name: Verify OBSERVED and IMPORTED records cannot recognize fee revenue
        run: |
          sqlite3 /tmp/builtegrity-economics.db "INSERT INTO transactions (id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,integrity_fee_earned_cents,fee_collection_method,record_classification) VALUES ('TX-OBS','PUR-0001','MER-0001','CUST-0001','PAYMENT','Observed payment',30000,'USD',0,'STRIPE_APPLICATION_FEE','OBSERVED');"
          sqlite3 /tmp/builtegrity-economics.db "INSERT INTO transactions (id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,integrity_fee_earned_cents,fee_collection_method,record_classification) VALUES ('TX-IMP','PUR-0001','MER-0001','CUST-0001','PAYMENT','Imported payment',30000,'USD',0,'STRIPE_APPLICATION_FEE','IMPORTED');"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-OBS';")" = "0"
          test "$(sqlite3 /tmp/builtegrity-economics.db "SELECT bg_fee_earned_cents FROM transactions WHERE id='TX-IMP';")" = "0"
          if sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET bg_fee_earned_cents=25 WHERE id='TX-OBS';" 2>/tmp/observed-revenue-error.txt; then
            echo "Expected D1 to reject revenue on OBSERVED record"
            exit 1
          fi
          grep -q 'Only PROTECTED transactions may recognize Builtegrity fee revenue' /tmp/observed-revenue-error.txt

      - name: Verify separate billing cannot replace protected transaction fee
        run: |
          if sqlite3 /tmp/builtegrity-economics.db "UPDATE transactions SET record_classification='PENDING_PROTECTED', fee_collection_method='AUTOMATIC_USAGE' WHERE id='TX-OBS';" 2>/tmp/separate-billing-error.txt; then
            echo "Expected protected-flow separate billing to be rejected"
            exit 1
          fi
          grep -q 'separate billing is prohibited' /tmp/separate-billing-error.txt

      - name: Verify automated PDF route and cache configuration
        run: |
          grep -q '/api/records/' worker/src/runtime.js
          grep -q 'serveTransactionPdf' worker/src/records.js
          grep -q 'TRANSACTION_RECORDS' worker/src/pdf.js
          grep -q 'TRANSACTION_RECORDS' wrangler.toml.example
          grep -q 'Download transaction record PDF' public/pay/success/index.html
          grep -q 'transaction_pdf_requests' migrations/0008_economics_records_pdf.sql
          grep -q 'Only PROTECTED transactions may recognize Builtegrity fee revenue' migrations/0025_transaction_protection_classification.sql
          grep -q 'Builtegrity does not separately bill merchants or partners' docs/transaction-protection-classification.md
