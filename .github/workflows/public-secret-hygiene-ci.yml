name: Public Secret Hygiene CI

on:
  push:
    branches: [main, public-repo-secret-hygiene]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan tracked tree for high-confidence credentials
        run: node scripts/check-public-secret-hygiene.mjs

      - name: Verify system gate includes secret hygiene
        run: |
          grep -q 'security:secret-hygiene' package.json
          grep -q 'security:secret-hygiene && npm run system:coherence' package.json
