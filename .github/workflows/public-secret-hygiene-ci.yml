name: Public Secret Hygiene CI

on:
  push:
    branches: [main, public-repo-secret-hygiene, docs-master-control-v1]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Scan tracked tree for high-confidence credentials
        run: node scripts/check-public-secret-hygiene.mjs

      - name: Verify deterministic dependency graph without package lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all

      - name: Verify system gates include secret and documentation hygiene
        run: |
          grep -q 'security:secret-hygiene' package.json
          grep -q 'docs:check' package.json
          node - <<'NODE'
          const pkg = require('./package.json');
          for (const name of ['system:gate', 'system:gate:live']) {
            const script = String(pkg.scripts?.[name] || '');
            const secret = script.indexOf('security:secret-hygiene');
            const docs = script.indexOf('docs:check');
            if (secret < 0 || docs < 0 || secret > docs) {
              console.error(`${name} must run secret hygiene before documentation integrity.`);
              process.exit(1);
            }
          }
          NODE
