name: Legal Compliance CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-legal-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check compliance JavaScript syntax
        run: |
          node --check worker/src/legal-compliance.js
          node --check worker/src/stripe.js

      - name: Build complete D1 schema
        run: |
          rm -f /tmp/builtegrity-legal.db
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            sqlite3 /tmp/builtegrity-legal.db < "${migration}"
          done
          sqlite3 /tmp/builtegrity-legal.db < transaction-engine/seed-tx-0001.sql

      - name: Verify V1 architecture defaults are fail closed
        run: |
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT launch_country||':'||launch_currency||':'||payment_architecture||':'||funds_custody_allowed||':'||platform_transfers_allowed||':'||marketplace_funds_routing_allowed||':'||international_merchants_allowed||':'||international_customer_sales_allowed||':'||subscriptions_allowed||':'||manual_payouts_allowed||':'||raw_card_data_allowed||':'||legal_launch_state FROM platform_compliance_controls WHERE id='GLOBAL';")" = "US:USD:STRIPE_DIRECT_CHARGE:0:0:0:0:0:0:0:0:BLOCKED"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT state FROM platform_legal_readiness;")" = "BLOCKED"

      - name: Verify forbidden architecture cannot be enabled in D1
        run: |
          for sql in \
            "UPDATE platform_compliance_controls SET funds_custody_allowed=1 WHERE id='GLOBAL';" \
            "UPDATE platform_compliance_controls SET platform_transfers_allowed=1 WHERE id='GLOBAL';" \
            "UPDATE platform_compliance_controls SET marketplace_funds_routing_allowed=1 WHERE id='GLOBAL';" \
            "UPDATE platform_compliance_controls SET international_merchants_allowed=1 WHERE id='GLOBAL';" \
            "UPDATE platform_compliance_controls SET subscriptions_allowed=1 WHERE id='GLOBAL';" \
            "UPDATE platform_compliance_controls SET raw_card_data_allowed=1 WHERE id='GLOBAL';"; do
            if sqlite3 /tmp/builtegrity-legal.db "$sql" >/dev/null 2>&1; then
              echo "Expected immutable legal architecture constraint to reject: $sql"
              exit 1
            fi
          done

      - name: Verify live merchant activation fails closed
        run: |
          if sqlite3 /tmp/builtegrity-legal.db "UPDATE merchants SET status='ACTIVE' WHERE id='MER-0001';" 2>/tmp/merchant-active-error.txt; then
            echo "Expected uncleared merchant activation to fail"
            exit 1
          fi
          grep -q "legal/compliance clearance" /tmp/merchant-active-error.txt

      - name: Verify USD-only database boundary
        run: |
          if sqlite3 /tmp/builtegrity-legal.db "UPDATE transactions SET currency='EUR' WHERE id='TX-0001';" 2>/tmp/nonusd.txt; then
            echo "Expected non-USD transaction to fail"
            exit 1
          fi
          grep -q "USD transactions only" /tmp/nonusd.txt

      - name: Verify legal documents start as unapproved drafts
        run: |
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM legal_document_versions WHERE status='DRAFT';")" -ge "8"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM legal_document_versions WHERE status='APPROVED';")" = "0"

      - name: Verify legal acceptance evidence is immutable
        run: |
          sqlite3 /tmp/builtegrity-legal.db "INSERT INTO merchant_legal_acceptances(id,merchant_id,external_user_id,document_type,document_version) VALUES('MLA-CI','MER-0001','user_ci','PLATFORM_AGREEMENT','draft-ci');"
          if sqlite3 /tmp/builtegrity-legal.db "UPDATE merchant_legal_acceptances SET document_version='rewritten' WHERE id='MLA-CI';" 2>/tmp/legal-evidence.txt; then
            echo "Expected legal acceptance evidence to be immutable"
            exit 1
          fi
          grep -q "immutable" /tmp/legal-evidence.txt

      - name: Verify privacy security and retention machinery exists
        run: |
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM pragma_table_info('privacy_requests');")" -gt "5"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM pragma_table_info('security_incidents');")" -gt "10"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM data_retention_policies;")" -ge "5"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM compliance_obligations WHERE obligation_type='REQUIRED';")" -ge "10"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM service_provider_registry WHERE personal_data_access=1 OR financial_data_access=1;")" -ge "5"

      - name: Verify Stripe path stays direct charge and card only
        run: |
          grep -q "accountId: tx.processor_account_id" worker/src/stripe.js
          grep -q "payment_method_types\[0\].*card" worker/src/stripe.js
          grep -q "billing_address_collection.*required" worker/src/stripe.js
          grep -q "payment_intent_data\[application_fee_amount\]" worker/src/stripe.js
          ! grep -R "stripeRequest(env, '/v1/transfers'.*POST" worker/src
          ! grep -R "stripeRequest(env, '/v1/topups'.*POST" worker/src
          ! grep -R "transfer_data\|destination\[\|on_behalf_of" worker/src

      - name: Verify no raw card or tax-ID columns were added
        run: |
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM pragma_table_info('customers') WHERE lower(name) IN ('card_number','pan','cvc','cvv','ssn','ein','tin','routing_number','bank_account_number','password');")" = "0"
          test "$(sqlite3 /tmp/builtegrity-legal.db "SELECT COUNT(*) FROM pragma_table_info('transactions') WHERE lower(name) IN ('card_number','pan','cvc','cvv','ssn','ein','tin','routing_number','bank_account_number','password');")" = "0"

      - name: Verify public legal and payment disclosures exist
        run: |
          test -s public/privacy/index.html
          test -s public/terms/index.html
          test -s public/legal/dpa/index.html
          test -s public/legal/acceptable-use/index.html
          test -s public/legal/fees/index.html
          test -s public/legal/electronic-records/index.html
          test -s public/legal/security/index.html
          test -s public/legal/subprocessors/index.html
          ! grep -R "This legacy Builtegrity route is no longer in use" public/privacy public/terms public/legal
          grep -q "Stripe processes" public/pay/index.html
          grep -q "not the seller, bank, insurer, or guarantor" public/pay/index.html

      - name: Verify required internal programs exist
        run: |
          test -s docs/legal-compliance-program.md
          test -s docs/information-security-program.md
          test -s docs/incident-response-plan.md
          test -s docs/data-retention-policy.md
          test -s docs/sales-tax-program.md
          test -s docs/international-expansion-gates.md
          grep -q "RI sales-tax" docs/legal-compliance-program.md
          grep -q "money-transmitter" docs/legal-compliance-program.md
          grep -q "INTERNATIONAL DISABLED" docs/international-expansion-gates.md
