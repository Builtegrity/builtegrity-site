name: Transaction Engine CI

on:
  push:
    branches:
      - engine-runtime-v1
      - provider-independent-auth
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check worker/src/cloudflare-access.js
          node --check worker/src/auth.js
          node --check worker/src/db.js
          node --check worker/src/stripe.js
          node --check worker/src/stripe-oauth.js
          node --check worker/src/webhooks.js
          node --check worker/src/index.js
          node --check worker/src/runtime.js
          node --check public/login/app.js
          node --check public/console/app.js
          node --check public/console/stripe-controls.js
          node --check public/pay/app.js
          node --check public/pay/success/app.js

      - name: Guard provider-independent admin access
        run: |
          if grep -R "builtegrity_admin_token\|X-Builtegrity-Admin" public .dev.vars.example wrangler.toml.example; then
            echo "Browser/admin-key authentication must not be reintroduced"
            exit 1
          fi
          if grep -q "INTERNAL_ADMIN_TOKEN" .dev.vars.example; then
            echo "Persistent internal admin tokens are not allowed"
            exit 1
          fi
          grep -q 'AUTH_PROVIDER = "CLOUDFLARE_ACCESS"' wrangler.toml.example
          grep -q 'ADMIN_HOSTNAME = "admin.builtegrity.com"' wrangler.toml.example
          grep -q 'CF_ACCESS_TEAM_DOMAIN' wrangler.toml.example
          grep -q 'CF_ACCESS_AUD' wrangler.toml.example
          grep -q "Cf-Access-Jwt-Assertion" worker/src/cloudflare-access.js
          grep -q "RSASSA-PKCS1-v1_5" worker/src/cloudflare-access.js

      - name: Build D1-compatible schema in SQLite
        run: |
          sqlite3 /tmp/builtegrity.db < migrations/0001_initial.sql
          sqlite3 /tmp/builtegrity.db < migrations/0002_runtime_controls.sql
          sqlite3 /tmp/builtegrity.db < migrations/0003_public_payment_tokens.sql
          sqlite3 /tmp/builtegrity.db < migrations/0004_checkout_resume.sql
          sqlite3 /tmp/builtegrity.db < migrations/0005_merchant_runtime_timestamp.sql
          sqlite3 /tmp/builtegrity.db < migrations/0006_stripe_oauth_states.sql
          sqlite3 /tmp/builtegrity.db < transaction-engine/seed-tx-0001.sql

      - name: Verify TX-0001 hierarchy and state
        run: |
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM partners WHERE id='PARTNER-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM merchants WHERE id='MER-0001' AND partner_id='PARTNER-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM customers WHERE id='CUST-0001' AND merchant_id='MER-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM purchases WHERE id='PUR-0001' AND customer_id='CUST-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM transactions WHERE id='TX-0001' AND lifecycle_status='CREATED' AND integrity_status='INCOMPLETE' AND payment_access_token='test-tx-0001-token';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM transaction_events WHERE transaction_id='TX-0001' AND event_type='TX_CREATED';")" = "1"

      - name: Verify event history is append-only
        run: |
          if sqlite3 /tmp/builtegrity.db "UPDATE transaction_events SET event_type='MUTATED' WHERE id='EVT-000001';" 2>/tmp/append-error.txt; then
            echo "Expected append-only trigger to reject event mutation"
            exit 1
          fi
          grep -q "append-only" /tmp/append-error.txt
