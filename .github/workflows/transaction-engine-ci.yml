name: Transaction Engine CI

on:
  push:
    branches:
      - watchdogs-v1
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check worker/src/clerk-auth.js
          node --check worker/src/cloudflare-access.js
          node --check worker/src/auth.js
          node --check worker/src/db.js
          node --check worker/src/stripe.js
          node --check worker/src/stripe-oauth.js
          node --check worker/src/webhooks.js
          node --check worker/src/watchdogs.js
          node --check worker/src/index.js
          node --check worker/src/runtime.js
          node --check public/login/app.js
          node --check public/console/app.js
          node --check public/console/stripe-controls.js
          node --check public/pay/app.js
          node --check public/pay/success/app.js
          node --check tests/stripe-runtime.test.mjs

      - name: Run dependency-free runtime regression tests
        run: npm test

      - name: Guard V1 auth and provider independence
        run: |
          if grep -R "builtegrity_admin_token\|X-Builtegrity-Admin" public .dev.vars.example wrangler.toml.example; then
            echo "Browser/admin-key authentication must not be reintroduced"
            exit 1
          fi
          if grep -q "INTERNAL_ADMIN_TOKEN" .dev.vars.example; then
            echo "Persistent internal admin tokens are not allowed"
            exit 1
          fi
          grep -q 'AUTH_PROVIDER = "CLERK"' wrangler.toml.example
          grep -q 'CLERK_ADMIN_USER_IDS' wrangler.toml.example
          grep -q 'CLERK_AUTHORIZED_PARTIES' wrangler.toml.example
          grep -q 'RSASSA-PKCS1-v1_5' worker/src/clerk-auth.js
          grep -q 'STRIPE_CONNECT_CLIENT_ID' wrangler.toml.example
          grep -q 'TURNSTILE_SITE_KEY' wrangler.toml.example
          grep -q 'RESEND_API_KEY' .dev.vars.example

      - name: Guard Stripe runtime integrity coverage
        run: |
          grep -q 'Idempotency-Key' worker/src/stripe.js
          grep -q 'retrieveCheckoutSession' worker/src/stripe.js
          grep -q "checkout.session.expired" worker/src/webhooks.js
          grep -q 'findBuiltegrityTransactionForCharge' worker/src/webhooks.js
          grep -q 'terms_integrity' worker/src/db.js
          grep -q 'payout_net_integrity' worker/src/db.js

      - name: Guard watchdog coverage
        run: |
          grep -q 'WATCHDOG_STAGE = "PREVIEW"' wrangler.toml.example
          grep -q 'crons = \["\*/15 \* \* \* \*", "17 13 \* \* \*"\]' wrangler.toml.example
          grep -q 'async scheduled' worker/src/runtime.js
          grep -q '/api/health/ready' worker/src/runtime.js
          grep -q '/api/watchdogs/status' worker/src/runtime.js
          grep -q 'stripe_webhook_receipts' worker/src/watchdogs.js
          grep -q 'EXPECTED_PAYOUT_NOT_FOUND' worker/src/watchdogs.js
          grep -q 'UNEXPECTED_FEE' worker/src/watchdogs.js
          grep -q 'retrieveConnectedAccount' worker/src/watchdogs.js
          grep -q 'api.resend.com/emails' worker/src/watchdogs.js

      - name: Build D1-compatible schema in SQLite
        run: |
          sqlite3 /tmp/builtegrity.db < migrations/0001_initial.sql
          sqlite3 /tmp/builtegrity.db < migrations/0002_runtime_controls.sql
          sqlite3 /tmp/builtegrity.db < migrations/0003_public_payment_tokens.sql
          sqlite3 /tmp/builtegrity.db < migrations/0004_checkout_resume.sql
          sqlite3 /tmp/builtegrity.db < migrations/0005_merchant_runtime_timestamp.sql
          sqlite3 /tmp/builtegrity.db < migrations/0006_stripe_oauth_states.sql
          sqlite3 /tmp/builtegrity.db < migrations/0007_watchdogs.sql
          sqlite3 /tmp/builtegrity.db < migrations/0008_checkout_integrity.sql
          sqlite3 /tmp/builtegrity.db < transaction-engine/seed-tx-0001.sql

      - name: Verify TX-0001 hierarchy and state
        run: |
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM partners WHERE id='PARTNER-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM merchants WHERE id='MER-0001' AND partner_id='PARTNER-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM customers WHERE id='CUST-0001' AND merchant_id='MER-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM purchases WHERE id='PUR-0001' AND customer_id='CUST-0001';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM transactions WHERE id='TX-0001' AND lifecycle_status='CREATED' AND integrity_status='INCOMPLETE' AND payment_access_token='test-tx-0001-token';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM transaction_events WHERE transaction_id='TX-0001' AND event_type='TX_CREATED';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM pragma_table_info('transactions') WHERE name='stripe_checkout_expires_at';")" = "1"

      - name: Verify Stripe object identifiers cannot cross transaction records
        run: |
          sqlite3 /tmp/builtegrity.db "INSERT INTO transactions (id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,terms_snapshot,stripe_charge_id) VALUES ('TX-0998','PUR-0001','MER-0001','CUST-0001','PAYMENT','first',100,'USD','terms','ch_unique_test');"
          if sqlite3 /tmp/builtegrity.db "INSERT INTO transactions (id,purchase_id,merchant_id,customer_id,transaction_type,description,amount_cents,currency,terms_snapshot,stripe_charge_id) VALUES ('TX-0999','PUR-0001','MER-0001','CUST-0001','PAYMENT','second',100,'USD','terms','ch_unique_test');" 2>/tmp/unique-error.txt; then
            echo "Expected duplicate Stripe charge ID to be rejected"
            exit 1
          fi
          grep -qi "unique" /tmp/unique-error.txt

      - name: Verify event history is append-only
        run: |
          if sqlite3 /tmp/builtegrity.db "UPDATE transaction_events SET event_type='MUTATED' WHERE id='EVT-000001';" 2>/tmp/append-error.txt; then
            echo "Expected append-only trigger to reject event mutation"
            exit 1
          fi
          grep -q "append-only" /tmp/append-error.txt

      - name: Verify watchdog ledger and deduplication
        run: |
          sqlite3 /tmp/builtegrity.db "INSERT INTO system_watchdog_runs (id,run_kind,trigger_source,status) VALUES ('run-test','FAST','ci','RUNNING');"
          sqlite3 /tmp/builtegrity.db "UPDATE system_watchdog_runs SET status='OK',finished_at=CURRENT_TIMESTAMP,checks_run=5 WHERE id='run-test';"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT status FROM system_watchdog_runs WHERE id='run-test';")" = "OK"
          sqlite3 /tmp/builtegrity.db "INSERT INTO system_alerts (alert_key,category,severity,message) VALUES ('test:dedupe','CI','WARN','first');"
          sqlite3 /tmp/builtegrity.db "INSERT INTO system_alerts (alert_key,category,severity,message) VALUES ('test:dedupe','CI','ERROR','second') ON CONFLICT(alert_key) DO UPDATE SET severity=excluded.severity,message=excluded.message,occurrences=system_alerts.occurrences+1;"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT COUNT(*) FROM system_alerts WHERE alert_key='test:dedupe';")" = "1"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT occurrences FROM system_alerts WHERE alert_key='test:dedupe';")" = "2"
          test "$(sqlite3 /tmp/builtegrity.db "SELECT severity FROM system_alerts WHERE alert_key='test:dedupe';")" = "ERROR"

      - name: Verify watchdog detection queries compile
        run: |
          sqlite3 /tmp/builtegrity.db "SELECT event_id FROM stripe_webhook_receipts WHERE status='FAILED' OR (status='PROCESSING' AND datetime(updated_at) < datetime('now','-15 minutes'));" >/dev/null
          sqlite3 /tmp/builtegrity.db "SELECT t.id FROM transactions t JOIN merchants m ON m.id=t.merchant_id WHERE t.lifecycle_status <> 'CREATED' OR t.integrity_status <> 'INCOMPLETE' OR t.payment_status IS NOT NULL LIMIT 500;" >/dev/null
          sqlite3 /tmp/builtegrity.db "SELECT id FROM merchants WHERE status='ACTIVE' AND processor='STRIPE' AND processor_account_id IS NOT NULL LIMIT 100;" >/dev/null
