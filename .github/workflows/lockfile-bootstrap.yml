name: Lockfile Bootstrap

on:
  push:
    branches: [public-repo-secret-hygiene]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-repo-secret-hygiene

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate deterministic npm lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git config user.name 'builtegrity-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock npm dependency graph'
          git push origin HEAD:public-repo-secret-hygiene
