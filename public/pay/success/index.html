<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment submitted · Builtegrity</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell narrow">
    <section class="panel">
      <p class="eyebrow">Builtegrity transaction record</p>
      <h1 style="font-size:clamp(32px,7vw,48px)">Payment submitted</h1>
      <p class="lede" style="font-size:16px">Your selected payment provider has returned you to the merchant's page. Final status comes from verified processor events, not this browser redirect.</p>
      <div id="status" class="notice">Checking the transaction record…</div>
      <p id="record-actions" hidden>
        <a id="pdf-link" href="#">Download transaction record PDF</a>
      </p>
    </section>
  </main>
  <script type="module" src="/pay/success/app.js"></script>
</body>
</html>
